<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI from the Inside - Logo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }

    .logo {
      width: 512px;
      height: 512px;
      background: #0f0f0f;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .glow {
      position: absolute;
      top: -80px;
      right: -80px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, transparent 60%);
      pointer-events: none;
    }

    .glow-2 {
      position: absolute;
      bottom: -100px;
      left: -60px;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .logo-mark {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 24px 64px rgba(236, 72, 153, 0.4);
      z-index: 1;
      margin-bottom: 32px;
    }

    .logo-mark::after {
      content: '';
      width: 64px;
      height: 64px;
      border: 10px solid #ffffff;
      border-radius: 50%;
    }

    .logo-mark::before {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      background: #ffffff;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .text {
      text-align: center;
      z-index: 1;
    }

    .title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2.2rem;
      font-weight: 400;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .title span {
      color: #ec4899;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="glow"></div>
    <div class="glow-2"></div>
    <div class="logo-mark"></div>
    <div class="text">
      <div class="title">AI from the <span>Inside</span></div>
    </div>
  </div>
</body>
</html>
